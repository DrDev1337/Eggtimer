<title>Äggtimern</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f3ec" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Äggtimern" />
<style>
  /* Äggtimern — samma palett och fysik som mobilappen, i ren HTML/CSS/JS. */
  @property --amp { syntax: '<number>'; initial-value: 0; inherits: true; }
  @property --sagx { syntax: '<number>'; initial-value: 1; inherits: true; }
  @property --sagy { syntax: '<number>'; initial-value: 1; inherits: true; }

  :root {
    --bg: #f7f3ec;
    --card: #ffffff;
    --ink: #211d19;
    --ink-soft: #988f85;
    --ink-faint: #c4bcb1;
    --line: #eae3d8;
    --yolk: #f2a03d;
    --yolk-deep: #e07a2f;
    --white: #fffdf8;
    --water: #ddedf2;
    --water-deep: #b8d8e3;
    --danger: #c4553b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }

  .view { display: none; height: 100dvh; }
  .view.active { display: flex; flex-direction: column; }

  /* ---------- Inställningar ---------- */
  #setup .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.2dvh, 16px);
    padding: clamp(8px, 1.4dvh, 16px) 20px calc(136px + env(safe-area-inset-bottom));
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    overflow-y: auto;
  }
  /* Tunn avdelare mellan sektionerna gör grupperna tydliga */
  .section + .section {
    border-top: 1px solid var(--line);
    padding-top: clamp(8px, 1.4dvh, 14px);
  }

  .header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 4px;
  }
  .wordmark {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 5px;
  }
  .info-btn {
    position: absolute;
    right: 0;
    top: 50%;
    translate: 0 -50%;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-faint);
    background: none;
    color: var(--ink-soft);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    cursor: pointer;
    line-height: 1;
  }
  .info-btn:active { background: var(--line); }
  .info-btn:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; }
  .lang-btn {
    position: absolute;
    left: 0;
    top: 50%;
    translate: 0 -50%;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1.5px solid var(--ink-faint);
    background: none;
    color: var(--ink-soft);
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    line-height: 1;
  }
  .lang-btn:active { background: var(--line); }
  .lang-btn:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; }

  .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .section { display: flex; flex-direction: column; gap: 8px; }
  .value { font-size: 15px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .hint { font-size: 13px; color: var(--ink-soft); text-align: center; }

  /* Äggväljaren — flera ägg i samma kastrull */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1.5px solid var(--line);
    background: var(--line);
    border-radius: 999px;
    padding: 6px 11px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .chip.on {
    background: var(--card);
    border-color: var(--card);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(33, 29, 25, 0.1);
  }
  .chip .x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink-soft);
    font-size: 11px;
    line-height: 1;
  }
  .chip.on .x { background: var(--bg); }
  .chip.add {
    background: none;
    border-style: dashed;
    border-color: var(--ink-faint);
    color: var(--ink-soft);
    font-weight: 600;
  }
  .chip:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; }

  /* Ägget */
  .egg-stage { display: flex; justify-content: center; }
  .egg {
    position: relative;
    width: clamp(84px, 15dvh, 150px);
    aspect-ratio: 200 / 240;
    transition: width 0.35s cubic-bezier(0.34, 1.4, 0.5, 1);
  }
  .egg > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .yolk-wrap {
    position: absolute;
    inset: 0;
    transform-origin: 50% 53%;
    animation: wobble 1.4s ease-in-out infinite;
    transition: --amp 0.4s, --sagx 0.4s, --sagy 0.4s;
  }
  @keyframes wobble {
    0%, 100% { transform: scale(var(--sagx), var(--sagy)); }
    25% { transform: scale(calc(var(--sagx) * (1 + var(--amp))), calc(var(--sagy) * (1 - var(--amp)))); }
    75% { transform: scale(calc(var(--sagx) * (1 - var(--amp))), calc(var(--sagy) * (1 + var(--amp)))); }
  }
  .yolk-wrap svg { width: 100%; height: 100%; display: block; }

  .yg { opacity: 0; transition: opacity 0.35s; }
  .egg[data-d='soft'] .y-soft { opacity: 1; }
  .egg[data-d='creamy'] .y-creamy { opacity: 1; }
  .egg[data-d='firm'] .y-firm { opacity: 1; }
  .egg[data-d='hard'] .y-hard { opacity: 1; }

  .spill { animation: ooze 2.8s ease-in-out infinite; }
  @keyframes ooze {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .yolk-wrap, .spill { animation: none; }
  }

  .egg[data-d='soft']   { --amp: 0.03;  --sagx: 1.06; --sagy: 0.96; }
  .egg[data-d='creamy'] { --amp: 0.018; --sagx: 1.03; --sagy: 0.98; }
  .egg[data-d='firm']   { --amp: 0.007; --sagx: 1.01; --sagy: 0.995; }
  .egg[data-d='hard']   { --amp: 0;     --sagx: 1;    --sagy: 1; }

  /* Segmenterad väljare */
  .seg {
    position: relative;
    display: flex;
    background: var(--line);
    border-radius: 18px;
    padding: 4px;
  }
  .seg .pill {
    position: absolute;
    top: 4px;
    bottom: 4px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(33, 29, 25, 0.1);
    transition: left 0.35s cubic-bezier(0.34, 1.3, 0.44, 1);
  }
  .seg button {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 7px 2px;
    border: 0;
    background: none;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 14px;
  }
  .seg button.on { color: var(--ink); font-weight: 600; }
  .seg button small { font-size: 10px; color: var(--ink-faint); font-weight: 400; }
  .seg button.on small { color: var(--ink-soft); }
  .seg button:focus-visible { outline: 2px solid var(--yolk); outline-offset: -2px; }

  /* Reglage */
  input[type='range'] { width: 100%; height: 26px; appearance: none; -webkit-appearance: none; background: none; cursor: pointer; }
  input[type='range']::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, var(--yolk) var(--fill, 0%), var(--line) var(--fill, 0%));
  }
  input[type='range']::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    margin-top: -8px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(33, 29, 25, 0.16);
  }
  input[type='range']::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  input[type='range']::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--yolk); }
  input[type='range']::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 2px 6px rgba(33, 29, 25, 0.16);
  }
  input[type='range']:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; border-radius: 4px; }

  .gps-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1.5px solid var(--yolk);
    background: none;
    border-radius: 999px;
    padding: 5px 12px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--yolk-deep);
    cursor: pointer;
    white-space: nowrap;
  }
  .gps-btn svg { flex: none; }
  .gps-btn:active { background: rgba(242, 160, 61, 0.12); }
  .gps-btn:focus-visible { outline: 2px solid var(--yolk); outline-offset: 2px; }
  .error { font-size: 13px; color: var(--danger); }

  /* Fot med koktid */
  .footer {
    position: fixed;
    bottom: 0;
    left: 50%;
    translate: -50%;
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px calc(16px + env(safe-area-inset-bottom));
    background: var(--card);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -4px 16px rgba(33, 29, 25, 0.08);
  }
  .footer time { font-size: 32px; font-weight: 200; letter-spacing: -1px; font-variant-numeric: tabular-nums; display: block; margin-top: 2px; }
  .multi-note { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .start-btn {
    border: 0;
    background: var(--yolk);
    color: var(--white);
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 14px 40px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(224, 122, 47, 0.35);
    cursor: pointer;
  }
  .start-btn:active { transform: scale(0.97); }
  .start-btn:focus-visible { outline: 3px solid var(--ink); }
  .warning { font-size: 13px; color: var(--danger); }

  /* ---------- Timer ---------- */
  #timer { align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .ring-wrap { position: relative; width: min(280px, 68vw, 36dvh); aspect-ratio: 1; }
  .ring-wrap > svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--line); stroke-width: 5; }
  .ring-fill { fill: none; stroke: var(--yolk); stroke-width: 5; stroke-linecap: round; }

  .scene {
    position: absolute;
    inset: 7.5%;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .float-egg {
    position: absolute;
    bottom: 18%;
    left: 35%;
    width: 30%;
    z-index: 1;
    animation: bob 2.8s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(-6px) rotate(-4deg); }
    50% { transform: translateY(4px) rotate(4deg); }
  }
  .wave { position: absolute; bottom: 0; left: 0; width: 220%; }
  .wave svg { display: block; width: 100%; }
  .wave-a { animation: drift 5.2s linear infinite; }
  .wave-b { opacity: 0.75; animation: drift 3.6s linear infinite; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-27%); } }
  .bubble {
    position: absolute;
    bottom: 6%;
    border-radius: 50%;
    background: #fff;
    animation: rise 2.4s ease-in infinite;
  }
  @keyframes rise {
    from { transform: translateY(0); opacity: 0.9; }
    to { transform: translateY(-64px); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .float-egg, .wave-a, .wave-b, .bubble { animation: none; }
  }

  .badge {
    width: 44%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--yolk);
    display: none;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: popin 0.5s cubic-bezier(0.34, 1.5, 0.5, 1);
  }
  .badge::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--yolk);
    animation: halo 1.8s ease-out infinite;
    z-index: -1;
  }
  @keyframes popin { from { transform: scale(0.3); } to { transform: scale(1); } }
  @keyframes halo { from { transform: scale(1); opacity: 0.35; } to { transform: scale(1.55); opacity: 0; } }
  .badge svg { width: 50%; }

  #timer.done .pot { display: none; }
  #timer.done .badge { display: flex; }

  .big-time { font-size: 60px; font-weight: 200; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  #timer.due .big-time { color: var(--yolk-deep); font-weight: 500; font-size: 44px; animation: duepulse 1s ease-in-out infinite; }
  @keyframes duepulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .timer-sub { font-size: 13px; color: var(--ink-soft); max-width: 320px; line-height: 1.5; }
  .timer-sub strong { color: var(--ink); font-weight: 600; }
  .timer-label { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-soft); }

  /* Ägglista på timerskärmen */
  .egg-rows { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 320px; }
  .egg-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--card);
    border-radius: 14px;
    padding: 9px 14px;
    font-size: 14px;
  }
  .egg-row .t { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 500; }
  .egg-row.due { outline: 2px solid var(--yolk); }
  .egg-row.due .t { color: var(--yolk-deep); font-weight: 700; }
  .egg-row.up { opacity: 0.55; }
  .egg-row.up .t { color: var(--ink-soft); }

  .cancel-btn {
    border: 1px solid var(--ink-faint);
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 13px 40px;
    border-radius: 999px;
    cursor: pointer;
  }
  .cancel-btn.primary { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .cancel-btn.due { background: var(--yolk); color: var(--white); border-color: var(--yolk); box-shadow: 0 4px 14px rgba(224, 122, 47, 0.45); }
  .cancel-btn:focus-visible { outline: 3px solid var(--yolk); }

  /* Instruktionsmodal */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(33, 29, 25, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .backdrop.open { display: flex; animation: fadein 0.25s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg);
    border-radius: 24px;
    padding: 26px 24px 22px;
    max-width: 360px;
    width: 100%;
    max-height: 86dvh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 20px 50px rgba(33, 29, 25, 0.3);
    animation: modalin 0.35s cubic-bezier(0.34, 1.3, 0.5, 1);
  }
  @keyframes modalin { from { transform: scale(0.92) translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .backdrop.open, .modal { animation: none; }
  }
  .modal h2 { font-size: 19px; font-weight: 700; letter-spacing: 0.2px; }
  .steps { display: flex; flex-direction: column; gap: 13px; }
  .step { display: flex; gap: 12px; align-items: flex-start; }
  .step-n {
    flex: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--yolk);
    color: var(--white);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .step p { font-size: 14px; line-height: 1.5; color: var(--ink); }
  .step p b { font-weight: 650; }
  .modal .fine { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .remember {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  .remember input { width: 17px; height: 17px; accent-color: var(--yolk); cursor: pointer; }
  .modal-close {
    border: 0;
    background: var(--ink);
    color: var(--white);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 13px;
    border-radius: 999px;
    cursor: pointer;
  }
  .modal-close:active { opacity: 0.85; }
  .modal-close:focus-visible { outline: 3px solid var(--yolk); }
  /* Låga skärmar (t.ex. mobil med webbläsarkrom): komprimera så att
     allt innehåll slutar med luft ovanför koktidskortet. */
  @media (max-height: 720px) {
    #setup .content { gap: 5px; }
    .section + .section { padding-top: 6px; }
    .header { padding-top: 0; }
    .egg { width: 74px; }
    .seg button { padding: 5px 2px; }
    .hint { font-size: 12px; }
    .chip { padding: 4px 10px; font-size: 12px; }
    input[type='range'] { height: 22px; }
    .footer { padding: 10px 20px calc(12px + env(safe-area-inset-bottom)); }
    .footer time { font-size: 28px; }
  }
</style>

<!-- ================= INSTÄLLNINGAR ================= -->
<div class="view active" id="setup">
  <div class="content">
    <div class="header">
      <div class="wordmark" id="wordmark">ÄGGTIMERN</div>
      <button class="lang-btn" id="lang" type="button" aria-label="Byt språk / switch language">EN</button>
      <button class="info-btn" id="info" type="button" aria-label="Visa instruktioner">i</button>
    </div>

    <div class="egg-stage">
      <div class="egg" id="egg" data-d="creamy">
        <svg viewBox="0 0 200 240" aria-hidden="true">
          <defs>
            <radialGradient id="gw" cx="50%" cy="42%" r="70%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#f4eee2" />
            </radialGradient>
          </defs>
          <path d="M100 14 C145 14 172 70 172 130 C172 185 140 226 100 226 C60 226 28 185 28 130 C28 70 55 14 100 14 Z"
            fill="url(#gw)" stroke="#eae3d8" stroke-width="3" />
        </svg>
        <div class="yolk-wrap">
          <svg viewBox="0 0 200 240" aria-hidden="true">
            <defs>
              <radialGradient id="gy-soft" cx="40%" cy="34%" r="75%">
                <stop offset="0%" stop-color="#ffb648" />
                <stop offset="70%" stop-color="#f68a14" />
                <stop offset="100%" stop-color="#e87607" />
              </radialGradient>
              <linearGradient id="gy-spill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ef820e" />
                <stop offset="100%" stop-color="#fca33c" />
              </linearGradient>
              <radialGradient id="gy-creamy" cx="42%" cy="36%" r="74%">
                <stop offset="0%" stop-color="#fbc866" />
                <stop offset="100%" stop-color="#f0932b" />
              </radialGradient>
              <radialGradient id="gy-core" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#e87d13" />
                <stop offset="75%" stop-color="#ec8c20" />
                <stop offset="100%" stop-color="#f0932b" />
              </radialGradient>
              <radialGradient id="gy-firm" cx="44%" cy="38%" r="72%">
                <stop offset="0%" stop-color="#fbda8b" />
                <stop offset="100%" stop-color="#f2ae40" />
              </radialGradient>
              <radialGradient id="gy-hard" cx="46%" cy="42%" r="70%">
                <stop offset="0%" stop-color="#f6e4ab" />
                <stop offset="100%" stop-color="#eec964" />
              </radialGradient>
            </defs>

            <g class="yg y-soft">
              <g class="spill">
                <path d="M64 148 C57 182 68 204 86 209 C96 212 110 211 120 205 C135 197 142 174 136 148 Z" fill="url(#gy-spill)" />
                <ellipse cx="112" cy="192" rx="10" ry="4.5" fill="#fff" opacity="0.26" transform="rotate(-14 112 192)" />
              </g>
              <circle cx="100" cy="126" r="48" fill="url(#gy-soft)" />
              <ellipse cx="84" cy="106" rx="15" ry="9.5" fill="#fff" opacity="0.55" transform="rotate(-22 84 106)" />
              <ellipse cx="116" cy="146" rx="7" ry="4" fill="#fff" opacity="0.22" transform="rotate(28 116 146)" />
            </g>

            <g class="yg y-creamy">
              <circle cx="100" cy="127" r="48" fill="url(#gy-creamy)" />

<script>
  'use strict';
  /* ===== Fysiken — Charles D. H. Williams formel (Univ. of Exeter, 1998) =====
     t = 0.451 · M^(2/3) · ln( 0.76 · (T_vatten − T_ägg) / (T_vatten − T_gula) )
     Kokpunkten vid höjd: barometriska formeln + Clausius–Clapeyron. */
  function boilingPointC(altitudeM) {
    const P0 = 101.325;
    const p = P0 * Math.pow(1 - 2.25577e-5 * altitudeM, 5.25588);
    const T = 1 / (1 / 373.15 - (8.3145 * Math.log(p / P0)) / 40660);
    return T - 273.15;
  }
  function cookSeconds(massG, startC, yolkC, altitudeM) {
    const waterC = boilingPointC(altitudeM);
    if (yolkC >= waterC - 1) return { seconds: null, waterC };
    const ratio = (0.76 * (waterC - startC)) / (waterC - yolkC);
    if (ratio <= 1) return { seconds: 0, waterC };
    return { seconds: Math.round(0.451 * Math.pow(massG, 2 / 3) * Math.log(ratio) * 60), waterC };
  }
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const sv = (n, d = 1) => n.toFixed(d).replace('.', state.lang === 'sv' ? ',' : '.');

  const STR = {
    sv: {
      title: 'Äggtimern', wordmark: 'ÄGGTIMERN',
      eggsInPot: 'Ägg i kastrullen', addEgg: '+ Lägg till ägg',
      doneness: 'Konsistens', weight: 'Vikt', startTemp: 'Starttemperatur', altitude: 'Höjd över havet',
      donenessName: { soft: 'Löskokt', creamy: 'Krämig', firm: 'Fast', hard: 'Hårdkokt' },
      donenessDesc: { soft: 'Rinnande gula', creamy: 'Tjock, gyllene kräm', firm: 'Fast men fuktig gula', hard: 'Helt genomkokt' },
      yolkCenter: (d, c) => `${d} · ${c} °C i gulans mitt`,
      tempName: { fridge: 'Kylskåpskallt', room: 'Rumsvarmt' },
      useLocation: 'Använd min position', locating: 'Hämtar…',
      boilInfo: (m, c) => `${m} m över havet · vattnet kokar vid ${c} °C`,
      cookTime: 'Koktid i kokande vatten',
      multiNote: (n, tt) => `${n} ägg · första klart ${tt}`,
      warning: (name, alt, w, y) => `${name}: på ${alt} m kokar vattnet vid ${w} °C — gulan kan aldrig nå ${y} °C. Välj en lösare konsistens.`,
      start: 'Starta', boiling: 'Kokar', ready: 'Klart!', finished: 'Färdigt', takeOut: 'Ta upp!',
      putIn: (n) => `Lägg ner ${n > 1 ? 'alla äggen' : 'ägget'} i det kokande vattnet nu.`,
      waterBoilsAt: (c) => `Vattnet kokar vid ${c} °C`,
      nextUp: (l) => `Näst upp: ${l}`,
      isDone: (l) => `${l} är färdigt`, takeRinse: ' — ta upp det och spola kallt.',
      gotIt: 'Upptaget ✓', cancel: 'Avbryt', newEggs: 'Nya ägg',
      doneRinse1: 'Spola ägget under kallt vatten så stannar tillagningen.',
      doneRinseN: 'Alla ägg upptagna. Spola dem under kallt vatten så stannar tillagningen.',
      notif: (l) => `Ta upp: ${l}!`,
      errNoGeo: 'Ingen platstjänst i den här webbläsaren — dra i reglaget i stället.',
      errNoAlt: 'Ingen höjddata gick att hämta — dra i reglaget i stället.',
      errNoPos: 'Kunde inte hämta position — dra i reglaget i stället.',
      introTitle: 'Så kokar du det perfekta ägget',
      steps: [
        ['Ställ in dina ägg', ' — vikt, kylskåpskallt eller rumsvarmt, önskad konsistens och din höjd över havet. Lägg till fler ägg med + om ni är flera.'],
        ['Koka upp vattnet.', ' Tiden gäller ägg som läggs i vatten som redan kokar — inte kallt vatten.'],
        ['Tryck Starta och lägg ner alla ägg samtidigt', ', försiktigt. Använd gärna en sked.'],
        ['Larmet ringer när varje ägg är klart', ' — ta upp det och spola det under kallt vatten så stannar tillagningen.'],
      ],
      introFine: 'Tiden räknas ut med Williams formel från University of Exeter — därför frågar appen om vikt, temperatur och höjd över havet. Håll appen öppen medan äggen kokar, så hålls skärmen vaken.',
      dontRemind: 'Påminn mig inte igen', letsGo: 'Nu kör vi',
      otherLang: 'EN',
    },
    en: {
      title: 'Egg Timer', wordmark: 'EGG TIMER',
      eggsInPot: 'Eggs in the pot', addEgg: '+ Add egg',
      doneness: 'Doneness', weight: 'Weight', startTemp: 'Starting temperature', altitude: 'Altitude',
      donenessName: { soft: 'Soft', creamy: 'Jammy', firm: 'Firm', hard: 'Hard' },
      donenessDesc: { soft: 'Runny yolk', creamy: 'Thick golden custard', firm: 'Set but moist yolk', hard: 'Cooked through' },
      yolkCenter: (d, c) => `${d} · ${c} °C at the yolk centre`,
      tempName: { fridge: 'Fridge-cold', room: 'Room temp' },
      useLocation: 'Use my location', locating: 'Locating…',
      boilInfo: (m, c) => `${m} m above sea level · water boils at ${c} °C`,
      cookTime: 'Cook time in boiling water',
      multiNote: (n, tt) => `${n} eggs · first ready in ${tt}`,
      warning: (name, alt, w, y) => `${name}: at ${alt} m water boils at ${w} °C — the yolk can never reach ${y} °C. Choose a softer doneness.`,
      start: 'Start', boiling: 'Boiling', ready: 'Ready!', finished: 'Done', takeOut: 'Take out!',
      putIn: (n) => `Put ${n > 1 ? 'all the eggs' : 'the egg'} into the boiling water now.`,
      waterBoilsAt: (c) => `Water boils at ${c} °C`,
      nextUp: (l) => `Next up: ${l}`,
      isDone: (l) => `${l} is ready`, takeRinse: ' — take it out and rinse it cold.',
      gotIt: 'Got it ✓', cancel: 'Cancel', newEggs: 'New eggs',
      doneRinse1: 'Rinse the egg under cold water to stop the cooking.',
      doneRinseN: 'All eggs out. Rinse them under cold water to stop the cooking.',
      notif: (l) => `Take out: ${l}!`,
      errNoGeo: 'No location service in this browser — use the slider instead.',
      errNoAlt: 'Could not fetch altitude data — use the slider instead.',
      errNoPos: 'Could not get your location — use the slider instead.',
      introTitle: 'How to boil the perfect egg',
      steps: [
        ['Set up your eggs', ' — weight, fridge-cold or room temperature, desired doneness and your altitude. Add more eggs with + if you are cooking for several.'],
        ['Bring the water to a boil.', ' The time applies to eggs lowered into already boiling water — not cold water.'],
        ['Press Start and lower all the eggs at once', ', gently. A spoon helps.'],
        ['The alarm rings as each egg gets ready', ' — take it out and rinse it under cold water to stop the cooking.'],
      ],
      introFine: 'The time is computed with the Williams formula from the University of Exeter — that is why the app asks about weight, temperature and altitude. Keep the app open while the eggs boil and the screen stays awake.',
      dontRemind: "Don't remind me again", letsGo: "Let's go",
      otherLang: 'SV',
    },
  };
  const DONENESS = [
    { key: 'soft', yolkC: 63 },
    { key: 'creamy', yolkC: 67 },
    { key: 'firm', yolkC: 71 },
    { key: 'hard', yolkC: 77 },
  ];
  const SIZES = [
    { key: 's', label: 'S', grams: 48 },
    { key: 'm', label: 'M', grams: 58 },
    { key: 'l', label: 'L', grams: 68 },
    { key: 'xl', label: 'XL', grams: 78 },
  ];
  const TEMPS = [
    { key: 'fridge', sub: '4 °C', c: 4 },
    { key: 'room', sub: '20 °C', c: 20 },
  ];
  const MAX_EGGS = 6;

  /* ===== Tillstånd, med minne mellan besök ===== */
  const STATE_KEY = 'aggtimern-state';
  const state = {
    eggs: [{ doneness: 'creamy', grams: 58, temp: 'fridge' }],
    active: 0,
    alt: 0,
    lang: (navigator.language || 'sv').toLowerCase().startsWith('sv') ? 'sv' : 'en',
  };
  try {
    const saved = JSON.parse(localStorage.getItem(STATE_KEY));
    if (saved && Array.isArray(saved.eggs) && saved.eggs.length) {
      state.eggs = saved.eggs
        .slice(0, MAX_EGGS)
        .filter((e) => DONENESS.some((d) => d.key === e.doneness) && TEMPS.some((t) => t.key === e.temp))
        .map((e) => ({ doneness: e.doneness, grams: Math.min(90, Math.max(40, +e.grams || 58)), temp: e.temp }));
      if (!state.eggs.length) state.eggs = [{ doneness: 'creamy', grams: 58, temp: 'fridge' }];
      state.active = Math.min(state.eggs.length - 1, Math.max(0, +saved.active || 0));
      state.alt = Math.min(4500, Math.max(0, +saved.alt || 0));
      if (saved.lang === 'sv' || saved.lang === 'en') state.lang = saved.lang;
    }
  } catch (e) { /* trasig eller avstängd lagring — kör standard */ }
  function persist() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) { /* ok */ }
  }

  const $ = (id) => document.getElementById(id);
  const L = () => STR[state.lang];
  const activeEgg = () => state.eggs[state.active];
  const sizeLabel = (g) => SIZES.find((s) => s.grams === g)?.label ?? `${g} g`;
  const eggName = (e) => `${L().donenessName[e.doneness]} ${sizeLabel(e.grams)}`;

  /* Segmenterad väljare med glidande indikator */
  function buildSeg(el, options, getActive, onPick, labelOf) {
    const pill = document.createElement('span');
    pill.className = 'pill';
    el.appendChild(pill);
    options.forEach((o) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.addEventListener('click', () => { onPick(o); render(); });
      el.appendChild(b);
    });
    return () => {
      const idx = options.findIndex((o) => o.key === getActive());
      const w = 100 / options.length;
      pill.style.width = `calc(${w}% - ${8 / options.length}px)`;
      pill.style.left = idx < 0 ? '4px' : `calc(4px + ${idx * w}%)`;
      pill.style.opacity = idx < 0 ? '0' : '1';
      [...el.querySelectorAll('button')].forEach((b, i) => {
        const o = options[i];
        const lab = labelOf(o);
        b.innerHTML = lab.sub ? `${lab.label}<small>${lab.sub}</small>` : lab.label;
        b.classList.toggle('on', i === idx);
      });
    };
  }

  const upd = [
    buildSeg($('seg-doneness'), DONENESS, () => activeEgg().doneness, (o) => (activeEgg().doneness = o.key),
      (o) => ({ label: L().donenessName[o.key] })),
    buildSeg($('seg-size'), SIZES, () => SIZES.find((s) => s.grams === activeEgg().grams)?.key, (o) => {
      activeEgg().grams = o.grams;
      $('grams').value = o.grams;
    }, (o) => ({ label: o.label })),
    buildSeg($('seg-temp'), TEMPS, () => activeEgg().temp, (o) => (activeEgg().temp = o.key),
      (o) => ({ label: L().tempName[o.key], sub: o.sub })),
  ];

  /* Äggchippen */
  function renderChips() {
    const el = $('egg-chips');
    el.innerHTML = '';
    state.eggs.forEach((e, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (i === state.active ? ' on' : '');
      b.append(document.createTextNode(eggName(e)));
      if (state.eggs.length > 1) {
        const x = document.createElement('span');
        x.className = 'x';
        x.textContent = '×';
        x.setAttribute('aria-label', 'Ta bort ägget');
        x.addEventListener('click', (ev) => {
          ev.stopPropagation();
          state.eggs.splice(i, 1);
          state.active = Math.min(state.active, state.eggs.length - 1);
          render();
        });
        b.appendChild(x);
      }
      b.addEventListener('click', () => { state.active = i; render(); });
      el.appendChild(b);
    });
    if (state.eggs.length < MAX_EGGS) {
      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'chip add';
      add.textContent = L().addEgg;
      add.addEventListener('click', () => {
        state.eggs.push({ ...activeEgg() });
        state.active = state.eggs.length - 1;
        render();
      });
      el.appendChild(add);
    }
  }

  function sliderFill(input) {
    const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
  }
  $('grams').addEventListener('input', (e) => { activeEgg().grams = +e.target.value; render(); });
  $('alt').addEventListener('input', (e) => { state.alt = +e.target.value; render(); });

  /* ===== Höjd: position → exakt markhöjd via Open-Meteos höjddatabas ===== */
  async function elevationFromCoords(lat, lon) {
    const r = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`, { signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const e = Array.isArray(j.elevation) ? j.elevation[0] : null;
    if (typeof e !== 'number') throw new Error('no elevation');
    return e;
  }
  $('gps').addEventListener('click', () => {
    $('gps-err').hidden = true;
    if (!navigator.geolocation) return showGpsErr(L().errNoGeo);
    $('gps-label').textContent = L().locating;
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        let alt = null;
        try {
          alt = await elevationFromCoords(pos.coords.latitude, pos.coords.longitude);
        } catch (e) {
          alt = pos.coords.altitude; // reservplan: GPS-höjden rakt av
        }
        $('gps-label').textContent = L().useLocation;
        if (alt == null) return showGpsErr(L().errNoAlt);
        state.alt = Math.min(4500, Math.max(0, Math.round(alt / 5) * 5));
        $('alt').value = state.alt;
        render();
      },
      () => { $('gps-label').textContent = L().useLocation; showGpsErr(L().errNoPos); },
      { timeout: 8000 }
    );
  });
  function showGpsErr(msg) { const e = $('gps-err'); e.textContent = msg; e.hidden = false; }

  function calcAll() {
    return state.eggs.map((e) => {
      const d = DONENESS.find((x) => x.key === e.doneness);
      const t = TEMPS.find((x) => x.key === e.temp);
      return { egg: e, d, t, ...cookSeconds(e.grams, t.c, d.yolkC, state.alt) };
    });
  }

  /* Statiska texter — skrivs om vid språkbyte */
  function applyLang() {
    const l = L();
    document.title = l.title;
    $('wordmark').textContent = l.wordmark;
    $('lang').textContent = l.otherLang;
    $('l-eggs').textContent = l.eggsInPot;
    $('l-doneness').textContent = l.doneness;
    $('l-weight').textContent = l.weight;
    $('l-temp').textContent = l.startTemp;
    $('l-alt').textContent = l.altitude;
    $('l-cooktime').textContent = l.cookTime;
    $('start').textContent = l.start;
    $('gps-label').textContent = l.useLocation;
    $('intro-title').textContent = l.introTitle;
    $('steps').innerHTML = l.steps
      .map((s, i) => `<div class="step"><div class="step-n">${i + 1}</div><p><b>${s[0]}</b>${s[1]}</p></div>`)
      .join('');
    $('intro-fine').textContent = l.introFine;
    $('remember-text').textContent = l.dontRemind;
    $('intro-close').textContent = l.letsGo;
  }
  $('lang').addEventListener('click', () => {
    state.lang = state.lang === 'sv' ? 'en' : 'sv';
    applyLang();
    render();
  });

  function render() {
    const all = calcAll();
    const act = all[state.active];
    $('egg').dataset.d = act.egg.doneness;
    $('doneness-hint').textContent = L().yolkCenter(L().donenessDesc[act.egg.doneness], act.d.yolkC);
    $('grams-out').textContent = act.egg.grams;
    $('grams').value = act.egg.grams;
    $('alt').value = state.alt;
    $('boil-out').textContent = L().boilInfo(state.alt, sv(act.waterC));
    sliderFill($('grams'));
    sliderFill($('alt'));
    renderChips();

    const broken = all.find((r) => r.seconds === null);
    const ok = !broken;
    $('footer-ok').style.display = ok ? '' : 'none';
    $('start').style.display = ok ? '' : 'none';
    $('footer-warn').hidden = ok;
    if (ok) {
      const times = all.map((r) => r.seconds).sort((a, b) => a - b);
      $('time-out').textContent = fmt(times[times.length - 1]);
      const multi = state.eggs.length > 1;
      $('multi-note').hidden = !multi;
      if (multi) $('multi-note').textContent = L().multiNote(state.eggs.length, fmt(times[0]));
    } else {
      $('footer-warn').textContent = L().warning(eggName(broken.egg), state.alt, sv(broken.waterC, 0), broken.d.yolkC);
    }
    upd.forEach((u) => u());
    persist();
  }

  /* Vågor i grytan */
  function wave(el, color) {
    const seg = 60, W = 720, amp = 14;
    let dPath = `M0 ${amp}`;
    for (let x = 0; x < W; x += seg) dPath += ` Q${x + seg / 4} 0 ${x + seg / 2} ${amp} T${x + seg} ${amp}`;
    el.innerHTML = `<svg viewBox="0 0 ${W} 200" preserveAspectRatio="none" style="height:${el.classList.contains('wave-a') ? 92 : 78}px"><path d="${dPath} L${W} 200 L0 200 Z" fill="${color}"/></svg>`;
  }
  wave($('wave-a'), '#ddedf2');
  wave($('wave-b'), '#b8d8e3');

  /* ===== Larm som inte ger sig ===== */
  let audioCtx = null, alarmInterval = null;
  function primeAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* ljud är inte kritiskt */ }
  }
  function chime() {
    if (audioCtx) {
      try {
        [0, 0.18, 0.36].forEach((t0, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = [880, 1100, 1320][i];
          g.gain.setValueAtTime(0.001, audioCtx.currentTime + t0);
          g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + t0 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t0 + 0.18);
          o.start(audioCtx.currentTime + t0); o.stop(audioCtx.currentTime + t0 + 0.2);
        });
      } catch (e) { /* ok */ }
    }
    if (navigator.vibrate) navigator.vibrate([220, 110, 220]);
  }
  function startAlarm(label) {
    if (!alarmInterval) {
      chime();
      alarmInterval = setInterval(chime, 1400);
    }
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted' && swReg) {
      swReg.showNotification(L().title, { body: L().notif(label), icon: 'icon-192.png', tag: 'aggtimern' }).catch(() => {});
    }
  }
  function stopAlarm() {
    if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; }
    if (navigator.vibrate) navigator.vibrate(0);
  }

  /* Håll skärmen vaken medan äggen kokar */
  let wakeLock = null;
  async function requestWakeLock() {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* stöds inte överallt */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (run && !document.hidden) requestWakeLock();
  });
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  /* ===== Timern — flera ägg, samma kastrull ===== */
  const RING_C = 2 * Math.PI * 147.5;
  $('ring').style.strokeDasharray = RING_C;
  let run = null, raf = 0;

  $('start').addEventListener('click', () => {
    const all = calcAll();
    if (all.some((r) => !r.seconds)) return;
    primeAudio();
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
    const eggs = all
      .map((r) => ({ label: eggName(r.egg), seconds: r.seconds, state: 'cooking' }))
      .sort((a, b) => a.seconds - b.seconds);
    run = { startAt: Date.now(), eggs, total: eggs[eggs.length - 1].seconds, waterC: all[0].waterC };
    requestWakeLock();

    $('timer').classList.remove('done', 'due');
    $('timer-label').textContent = L().boiling;
    $('timer-sub').innerHTML = `<strong>${L().putIn(eggs.length)}</strong><br>${L().waterBoilsAt(sv(run.waterC))}`;
    $('egg-rows').hidden = eggs.length < 2;
    $('cancel').textContent = L().cancel;
    $('cancel').className = 'cancel-btn';
    show('timer');
    tick();
  });

  function tick() {
    if (!run) return;
    const elapsed = (Date.now() - run.startAt) / 1000;
    run.eggs.forEach((e) => {
      if (e.state === 'cooking' && elapsed >= e.seconds) {
        e.state = 'due';
        startAlarm(e.label);
      }
    });

    $('ring').style.strokeDashoffset = RING_C * Math.max(0, 1 - elapsed / run.total);

    const due = run.eggs.find((e) => e.state === 'due');
    const next = run.eggs.find((e) => e.state === 'cooking');
    if (due) {
      $('timer').classList.add('due');
      $('timer-label').textContent = L().ready;
      $('big-time').textContent = L().takeOut;
      $('timer-sub').innerHTML = `<strong>${L().isDone(due.label)}</strong>${L().takeRinse}`;
      $('cancel').textContent = L().gotIt;
      $('cancel').className = 'cancel-btn due';
    } else {
      $('timer').classList.remove('due');
      $('timer-label').textContent = L().boiling;
      if (next) {
        const left = Math.max(0, Math.ceil(next.seconds - elapsed));
        $('big-time').textContent = fmt(left);
        if (run.eggs.length > 1) {
          $('timer-sub').innerHTML = `<strong>${L().nextUp(next.label)}</strong><br>${L().waterBoilsAt(sv(run.waterC))}`;
        }
      }
      $('cancel').textContent = L().cancel;
      $('cancel').className = 'cancel-btn';
    }

    if (run.eggs.length > 1) {
      $('egg-rows').innerHTML = run.eggs
        .map((e) => {
          const left = Math.max(0, Math.ceil(e.seconds - elapsed));
          const cls = e.state === 'due' ? 'due' : e.state === 'up' ? 'up' : '';
          const t = e.state === 'up' ? '✓' : e.state === 'due' ? L().takeOut : fmt(left);
          return `<div class="egg-row ${cls}"><span>${e.label}</span><span class="t">${t}</span></div>`;
        })
        .join('');
    }

    raf = requestAnimationFrame(tick);
  }

  function finish() {
    cancelAnimationFrame(raf);
    stopAlarm();
    releaseWakeLock();
    $('timer').classList.remove('due');
    $('timer').classList.add('done');
    $('timer-label').textContent = L().finished;
    $('big-time').textContent = L().ready;
    $('timer-sub').textContent = run.eggs.length > 1 ? L().doneRinseN : L().doneRinse1;
    $('egg-rows').hidden = true;
    $('ring').style.strokeDashoffset = 0;
    $('cancel').textContent = L().newEggs;
    $('cancel').className = 'cancel-btn primary';
    run = null;
  }

  $('cancel').addEventListener('click', () => {
    if (run) {
      const due = run.eggs.find((e) => e.state === 'due');
      if (due) {
        due.state = 'up';
        if (!run.eggs.some((e) => e.state === 'due')) stopAlarm();
        if (run.eggs.every((e) => e.state === 'up')) finish();
        return;
      }
    }
    cancelAnimationFrame(raf);
    stopAlarm();
    releaseWakeLock();
    run = null;
    show('setup');
    render();
  });

  function show(id) {
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === id));
  }

  /* Instruktioner: visas automatiskt vid första besöket, alltid via ⓘ */
  const INTRO_KEY = 'aggtimern-intro-seen';
  let stored = null;
  try { stored = localStorage.getItem(INTRO_KEY); } catch (e) { /* privat läge utan lagring */ }
  function openIntro(firstRun) {
    $('remember-row').style.display = firstRun ? '' : 'none';
    $('intro').classList.add('open');
    $('intro-close').focus();
  }
  $('intro-close').addEventListener('click', () => {
    $('intro').classList.remove('open');
    if ($('remember-row').style.display !== 'none' && $('dont-remind').checked) {
      try { localStorage.setItem(INTRO_KEY, '1'); } catch (e) { /* ok utan lagring */ }
    }
  });
  $('intro').addEventListener('click', (e) => { if (e.target === $('intro')) $('intro-close').click(); });
  $('info').addEventListener('click', () => openIntro(false));
  if (!stored) openIntro(true);

  /* PWA: service worker för offline och hemskärmsinstallation */
  let swReg = null;
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').then((r) => (swReg = r)).catch(() => {});
  }

  applyLang();
  render();
</script>
